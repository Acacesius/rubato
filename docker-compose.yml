# rubato: prebuilt image from GHCR.
#   Start:   docker compose up -d && docker compose logs rubato   (setup token is in the logs)
#   Update:  docker compose pull && docker compose up -d
# Settings come from .env next to this file (see .env.example); all are optional.
services:
  rubato:
    image: ghcr.io/acacesius/rubato:latest
    restart: unless-stopped
    # Must be able to write ./config (keys, setup state, cookies.txt) and ./cache (artwork).
    user: "${RUBATO_UID:-1000}:${RUBATO_GID:-1000}"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      ROOT_PATH: ${ROOT_PATH:-}
      HOST_KEY: ${HOST_KEY:-}
      SPEAKER_KEY: ${SPEAKER_KEY:-}
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
      PROBE_VIDEO_ID: ${PROBE_VIDEO_ID:-}
      DOWNLOAD_RATE: ${DOWNLOAD_RATE:-2}
      ART_CACHE_MB: ${ART_CACHE_MB:-300}
      YTM_CLIENT_ID: ${YTM_CLIENT_ID:-}
      YTM_CLIENT_SECRET: ${YTM_CLIENT_SECRET:-}
    ports:
      # Docker publishes ports around host firewalls such as UFW, so BIND is the
      # real exposure control. Keep 127.0.0.1 and put a reverse proxy/tunnel in front.
      - "${BIND:-127.0.0.1}:${PORT:-8766}:8766"
    volumes:
      - ./config:/app/config
      # Artwork cache (album art, artist images): served from here so phones don't each fetch from Google.
      - ./cache:/app/cache
    # Hardening: no root, no capabilities, no privilege escalation, read-only
    # root filesystem (only ./config, ./cache and the /tmp tmpfs are writable), bounded
    # memory and processes. Never mount the Docker socket into this container.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${MEM_LIMIT:-1g}
    pids_limit: 256
    tmpfs:
      - /tmp:size=256m,mode=1777
