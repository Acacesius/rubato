<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* Works at / or under a path prefix (e.g. /rubato/): every URL below resolves against the app root. */
(function () { var b = document.createElement("base"); b.href = location.pathname.replace(/\/(host|speaker|setup)?\/?$/, "") + "/"; document.head.appendChild(b); })();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#110D0E">
<meta name="referrer" content="no-referrer">
<title>rubato · speaker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 -11 38 38'%3E%3Cpath d='M2 8 C4 2, 6 2, 8 8 S12 14, 15 8 S21 2, 25 8 S33 14, 36 8' fill='none' stroke='%23F2506A' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preload" href="static/fonts/bricolage-grotesque-latin-opsz-wdth-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="static/rubato.css?v=0.2.0">
<link rel="stylesheet" href="static/themes.css?v=0.2.0">
<script>try{var t=localStorage.getItem("rubato.theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="speaker">
  <header>
    <span class="wordmark">rubato<svg viewBox="0 0 38 16" aria-hidden="true"><path d="M2 8 C4 2, 6 2, 8 8 S12 14, 15 8 S21 2, 25 8 S33 14, 36 8"/></svg></span>
    <div class="right">
      <span class="volcap" id="volcap"></span>
      <button class="iconbtn bare" id="theme-btn" aria-label="Theme" title="Theme"></button>
      <span class="pill spill off" id="sp-pill" role="status"></span>
    </div>
  </header>
  <div class="banner hidden" id="banner" role="alert"><span class="dot off"></span><span id="banner-t"></span></div>
  <main>
    <div class="left">
      <div style="position:relative" id="cone-slot">
        <button class="tap hidden" id="tap" aria-label="Tap to start speaker"><span class="play" id="tap-ic"></span><b>Tap to start speaker</b></button>
      </div>
      <label class="speaker-name hidden" id="name-row"><span class="label">Speaker name</span><input class="textin" id="dev-name" maxlength="20" placeholder="Living room"></label>
      <section class="card joincard" aria-label="Join">
        <div class="row"><span class="label red">Grab the aux</span><span class="label" id="people"></span></div>
        <div class="url ellip" id="url"></div>
        <div class="codebox" id="codebox" aria-label="Room code"></div>
      </section>
    </div>
    <div class="right">
      <div class="label red now-label" id="now-label">Nothing playing</div>
      <h1 class="display title" id="title">Queue something</h1>
      <p class="sub ellip" id="sub">Scan in, search, and it plays here.</p>
      <div id="prog-slot"></div>
      <section class="hands" aria-label="Hands on it"><div class="label">Hands on it</div><div class="list" id="hands"></div></section>
      <section class="upnext" aria-label="Up next"><div class="label">Up next</div><div id="upnext" style="margin-top:6px"></div></section>
    </div>
  </main>
</div>

<div class="overlay hidden" id="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-h">
  <div class="box">
    <span class="wordmark" style="font-size:34px">rubato<svg viewBox="0 0 38 16" aria-hidden="true"><path d="M2 8 C4 2, 6 2, 8 8 S12 14, 15 8 S21 2, 25 8 S33 14, 36 8"/></svg></span>
    <h2 class="display" id="ov-h"></h2>
    <p id="ov-p"></p>
    <form id="ov-key" class="hidden" autocomplete="off" style="display:flex;gap:10px;margin-bottom:14px">
      <input class="textin mono" id="ov-key-in" aria-label="Speaker key" placeholder="Speaker key" spellcheck="false" autocapitalize="off">
      <button class="btn red" style="height:52px">Connect</button>
    </form>
    <button class="btn red" id="ov-btn"></button>
  </div>
</div>
<audio id="audio" preload="auto"></audio>
<script src="static/common.js?v=0.2.0"></script>
<script src="static/speaker.js?v=0.2.0"></script>
</body>
</html>
